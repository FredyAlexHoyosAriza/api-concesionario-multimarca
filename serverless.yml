service: api-concesionario-serverless

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DB_URL: ${env:DB_URL}
    JWT_SECRET: ${env:JWT_SECRET}

functions:
  getUser:
    handler: src/handlers/usuarioHandler.getUser
    events:
      - http:
          path: usuarios/{id}
          method: get

  createUser:
    handler: src/handlers/usuarioHandler.createUser
    events:
      - http:
          path: usuarios
          method: post

  updateUser:
    handler: src/handlers/usuarioHandler.updateUser
    events:
      - http:
          path: usuarios/{id}
          method: put

  deleteUser:
    handler: src/handlers/usuarioHandler.deleteUser
    events:
      - http:
          path: usuarios/{id}
          method: delete
